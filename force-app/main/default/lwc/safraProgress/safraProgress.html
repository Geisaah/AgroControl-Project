<template>
    <lightning-card title="Monitoramento da Safra" icon-name="custom:custom51">
        
        <div class="slds-p-around_medium">
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <div class="slds-grid slds-grid_vertical-align-center">
                    <lightning-icon icon-name="utility:frozen" size="small" class="slds-m-right_small"></lightning-icon>
                    <div>
                        <p class="slds-text-title_caps">Clima em Paracatu</p>
                        <template if:true={temperatura}>
                            <p class="slds-text-heading_small">{temperatura}°C - {condicao}</p>
                        </template>
                        <template if:false={temperatura}>
                            <p class="slds-text-body_small slds-italic">Buscando dados em tempo real...</p>
                        </template>
                    </div>
                </div>
            </div>

            <template if:true={daysRemaining}>
                <p class="slds-text-heading_small slds-m-bottom_small">
                    Faltam <strong>{daysRemaining}</strong> dias para a colheita!
                </p>
                <lightning-progress-bar 
                    value={progressValue} 
                    size="large" 
                    variant="circular">
                </lightning-progress-bar>
            </template>

            <template if:false={daysRemaining}>
                <p>Calculando progresso da safra...</p>
            </template>
        </div>
    </lightning-card>
</template>
